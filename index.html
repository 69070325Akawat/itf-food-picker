<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Picker ITF</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 1. Navbar ด้านบน -->
  <nav class="navbar">
    <h2>FOODPICKER ITF - 69070325</h2>
  </nav>

  <!-- 2. ส่วนแสดงผลอาหาร -->
  <div class="card">
    <img id="food-img" src="kaomankai.jpg" alt="รูปอาหาร">
    <h1 id="food-name">ข้าวมันไก่</h1>
    <p id="food-desc">ข้าวหุงนุ่มๆ พร้อมไก่ต้มสุกกำลังดีและน้ำจิ้มรสเด็ด</p>
    <p class="price"><span id="food-price">50 - 60</span> บาท</p>
    
    <!-- 3. ปุ่มสุ่ม -->
    <button id="random-btn">สุ่มเมนูอาหาร</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
